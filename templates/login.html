{% extends "base.html" %}
{% block title %}RifOs — Iniciar sesión{% endblock %}
{% block extra_head %}
<style>
.auth-wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-box{width:100%;max-width:400px;animation:fadeIn .4s ease both}
.auth-header{text-align:center;margin-bottom:2rem}
.auth-header .icon{font-size:2.2rem;display:block;margin-bottom:.8rem}
.auth-header h1{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--neon-cyan);letter-spacing:4px;text-shadow:0 0 20px var(--neon-cyan)}
.auth-header p{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--text-dim);letter-spacing:2px;margin-top:.4rem}
.auth-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:2rem;position:relative;overflow:hidden}
.auth-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon-cyan),transparent)}
.btn-submit{width:100%;justify-content:center;padding:.75rem;font-size:.88rem;border:1px solid var(--neon-cyan);color:var(--neon-cyan);background:transparent;border-radius:4px;margin-top:.3rem;cursor:pointer;transition:all .2s;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:2px}
.btn-submit:hover{background:rgba(0,255,204,.08);box-shadow:0 0 25px rgba(0,255,204,.2)}
.auth-footer{text-align:center;margin-top:1rem;font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--text-dim);letter-spacing:1px}
.auth-footer a{color:var(--neon-blue);text-decoration:none}
.auth-footer a:hover{text-decoration:underline}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-header">
      <span class="icon">🔐</span>
      <h1>INICIAR SESIÓN</h1>
      <p>accede a tu panel de rifas</p>
    </div>
    <div class="auth-panel">
      {% if error %}<div class="error-msg">⚠ {{ error }}</div>{% endif %}
      <form method="POST">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="form-group" style="margin-bottom:.3rem">
          <label>Contraseña</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">INGRESAR →</button>
      </form>
    </div>
    <div class="auth-footer">
      ¿No tienes cuenta? <a href="{{ url_for('register') }}">REGÍSTRATE GRATIS</a>
    </div>
  </div>
</div>
{% endblock %}
