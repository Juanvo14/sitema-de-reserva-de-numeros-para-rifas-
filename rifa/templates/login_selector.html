{% extends "base.html" %}
{% block title %}NeoRifa — Acceso{% endblock %}

{% block extra_head %}
<style>
  .selector-wrap {
    min-height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 3rem;
  }

  .hero-title {
    text-align: center;
    animation: fadeIn 0.6s ease both;
  }
  .hero-title h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: var(--text-bright);
    letter-spacing: 6px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .hero-title h2 span {
    color: var(--neon-blue);
    text-shadow: 0 0 30px var(--neon-blue), 0 0 60px rgba(0,212,255,0.3);
  }
  .hero-title p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 4px;
    margin-top: 0.8rem;
    text-transform: uppercase;
  }

  .cards-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    width: 100%;
    max-width: 560px;
    animation: fadeIn 0.6s 0.15s ease both;
  }

  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2.2rem 1.8rem;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .login-card:hover { transform: translateY(-4px); }

  .login-card.admin::before {
    background: radial-gradient(ellipse at 50% 0%, rgba(168,85,247,0.12) 0%, transparent 70%);
  }
  .login-card.admin:hover {
    border-color: var(--neon-purple);
    box-shadow: 0 0 30px rgba(168,85,247,0.15), 0 8px 32px rgba(0,0,0,0.4);
  }
  .login-card.admin:hover::before { opacity: 1; }
  .login-card.admin:hover .card-icon { color: var(--neon-purple); text-shadow: 0 0 20px var(--neon-purple); }
  .login-card.admin:hover .card-label { color: var(--neon-purple); }

  .login-card.usuario::before {
    background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.1) 0%, transparent 70%);
  }
  .login-card.usuario:hover {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 30px rgba(0,255,204,0.12), 0 8px 32px rgba(0,0,0,0.4);
  }
  .login-card.usuario:hover::before { opacity: 1; }
  .login-card.usuario:hover .card-icon { color: var(--neon-cyan); text-shadow: 0 0 20px var(--neon-cyan); }
  .login-card.usuario:hover .card-label { color: var(--neon-cyan); }

  .card-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    color: var(--text-dim);
    transition: all 0.25s;
    display: block;
  }

  .card-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--text);
    text-transform: uppercase;
    transition: color 0.25s;
  }

  .card-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-top: 0.5rem;
  }

  .deco-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
    animation: pulse-glow 3s infinite;
  }
</style>
{% endblock %}

{% block content %}
<div class="selector-wrap">
  <div class="hero-title">
    <h2>SISTEMA DE<br><span>RESERVAS</span></h2>
    <p>selecciona tu tipo de acceso</p>
  </div>

  <div class="deco-line"></div>

  <div class="cards-row">
    <a href="{{ url_for('login_admin') }}" class="login-card admin">
      <span class="card-icon">⚙️</span>
      <div class="card-label">Admin</div>
      <div class="card-sub">gestión total</div>
    </a>
    <a href="{{ url_for('login_usuario') }}" class="login-card usuario">
      <span class="card-icon">🎟️</span>
      <div class="card-label">Usuario</div>
      <div class="card-sub">reservar número</div>
    </a>
  </div>
</div>
{% endblock %}
